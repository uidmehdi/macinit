---
- name: Remove unused Homebrew dependencies
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew autoremove"
  register: macinit_brew_autoremove
  changed_when: false
  tags: [cleanup, brew]

- name: Remove stale lock files and outdated downloads
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew cleanup"
  register: macinit_brew_cleanup
  changed_when: false
  tags: [cleanup, brew]

- name: Check system for potential problems
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew doctor"
  register: macinit_brew_doctor
  changed_when: false
  failed_when: macinit_brew_doctor.rc not in [0, 1]
  tags: [cleanup, brew]
