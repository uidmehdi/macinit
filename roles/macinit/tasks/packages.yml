---
- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  tags: [packages, brew]

- name: Add Homebrew taps
  community.general.homebrew_tap:
    name: "{{ macinit_homebrew_tap }}"
    state: present
  when: macinit_homebrew_tap | length > 0
  tags: [packages, brew]

- name: Trust third-party Homebrew taps
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew trust {{ item }}"
  register: macinit_brew_trust_result
  changed_when: "'now trusted' in (macinit_brew_trust_result.stdout | lower)"
  failed_when: >-
    macinit_brew_trust_result.rc != 0 and
    'already trusted' not in (macinit_brew_trust_result.stderr | lower)
  loop: "{{ macinit_homebrew_tap }}"
  when: macinit_homebrew_tap | length > 0
  tags: [packages, brew]

- name: Install Homebrew formulae
  when: macinit_homebrew | length > 0
  tags: [packages, brew]
  block:
    - name: Install formula
      community.general.homebrew:
        name: "{{ item.name | default(item) }}"
        state: present
        install_options: "{{ item.install_options | default(omit) }}"
        update_homebrew: false
      loop: "{{ macinit_homebrew }}"
  rescue:
    - name: Warn on failed formulae installs
      ansible.builtin.debug:
        msg: "Formula install failed: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: Resolve desired package names
  ansible.builtin.set_fact:
    macinit_desired_formulae: "{{ (macinit_homebrew | selectattr('name', 'defined') | map(attribute='name') | map('lower') | list)
                        + (macinit_homebrew | select('string') | map('lower') | list) }}"
    macinit_desired_casks: "{{ (macinit_homebrew_cask | selectattr('name', 'defined') | map(attribute='name')
                     | map('regex_replace', '^.*/', '') | map('lower') | list)
                     + (macinit_homebrew_cask | select('string') | map('regex_replace', '^.*/', '') | map('lower') | list) }}"
  tags: [packages, brew, cask]

- name: Get explicitly installed Homebrew formulae
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew list --formula --full-name --installed-on-request"
  register: macinit_brew_formulae_installed
  changed_when: false
  check_mode: false
  tags: [packages, brew]

- name: Remove formulae not in desired list
  community.general.homebrew:
    name: "{{ item }}"
    state: absent
  register: macinit_brew_formula_remove_result
  failed_when: >-
    macinit_brew_formula_remove_result is failed and
    'Refusing to uninstall' not in (macinit_brew_formula_remove_result.msg | default(''))
  loop: "{{ macinit_brew_formulae_installed.stdout_lines }}"
  when: macinit_homebrew_prune_enabled | bool and macinit_homebrew | length > 0 and item | lower not in macinit_desired_formulae
  tags: [packages, brew]

- name: Upgrade all Homebrew formulae
  when: macinit_homebrew_upgrade_all | default(true)
  tags: [packages, brew]
  block:
    - name: Get outdated Homebrew formulae
      ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew outdated --formula --quiet"
      register: macinit_brew_outdated_formulae
      changed_when: false
      check_mode: false

    - name: Upgrade outdated Homebrew formulae
      vars:
        # Exclude ansible/ansible-lint: upgrading the formula that is currently
        # running this playbook corrupts the controller's module communication
        # mid-run (deserialization failures). Upgrade these manually instead.
        macinit_formulae_to_upgrade: "{{ macinit_brew_outdated_formulae.stdout_lines | difference(['ansible', 'ansible-lint']) }}"
      ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew upgrade --formula {{ macinit_formulae_to_upgrade | join(' ') }}"
      register: macinit_brew_upgrade
      changed_when: macinit_brew_upgrade.stdout is defined and macinit_brew_upgrade.stdout | length > 0
      when: macinit_formulae_to_upgrade | length > 0
  rescue:
    - name: Warn on failed formulae upgrade
      ansible.builtin.debug:
        msg: "Formula upgrade failed: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: Manage Homebrew casks
  tags: [packages, cask]
  block:
    - name: Temporarily allow passwordless sudo for Homebrew cask installers
      ansible.builtin.copy:
        content: "{{ ansible_facts['user_id'] }}  ALL = (ALL) NOPASSWD: ALL\n"
        dest: "{{ macinit_homebrew_cask_temporary_sudoers_path }}"
        owner: root
        group: wheel
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: true
      when:
        - macinit_homebrew_cask_temporary_passwordless_sudo | default(false) | bool
        - macinit_homebrew_cask | length > 0 or macinit_homebrew_upgrade_all | default(true) | bool

    - name: Warm sudo credentials for Homebrew cask installers
      ansible.builtin.command: /usr/bin/true
      become: true
      changed_when: false
      when:
        - macinit_homebrew_cask_sudo_keepalive | default(true) | bool
        - not macinit_homebrew_cask_temporary_passwordless_sudo | default(false) | bool
        - macinit_homebrew_cask | length > 0 or macinit_homebrew_upgrade_all | default(true) | bool

    - name: Keep sudo credentials warm during Homebrew cask operations
      ansible.builtin.shell:
        cmd: >-
          while /usr/bin/sudo -n -v; do
          /bin/sleep {{ macinit_homebrew_cask_sudo_keepalive_interval | default(60) | int }};
          done & echo $!
        executable: /bin/bash
      register: macinit_homebrew_cask_sudo_keepalive_pid
      changed_when: false
      when:
        - macinit_homebrew_cask_sudo_keepalive | default(true) | bool
        - not macinit_homebrew_cask_temporary_passwordless_sudo | default(false) | bool
        - macinit_homebrew_cask | length > 0 or macinit_homebrew_upgrade_all | default(true) | bool

    - name: Install Homebrew cask packages
      when: macinit_homebrew_cask | length > 0
      block:
        - name: Install cask
          community.general.homebrew_cask:
            name: "{{ item.name | default(item) }}"
            state: present
            install_options: "{{ item.install_options | default(omit) }}"
            update_homebrew: false
          loop: "{{ macinit_homebrew_cask }}"
      rescue:
        - name: Warn on failed cask installs
          ansible.builtin.debug:
            msg: "Cask install failed: {{ ansible_failed_result.msg | default('unknown error') }}"

    - name: Get installed Homebrew casks
      ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew list --cask"
      register: macinit_brew_casks_installed
      changed_when: false
      check_mode: false

    - name: Remove casks not in desired list
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: absent
      loop: "{{ macinit_brew_casks_installed.stdout_lines }}"
      when: macinit_homebrew_prune_enabled | bool and macinit_homebrew_cask | length > 0 and item | lower not in macinit_desired_casks

    - name: Upgrade all Homebrew casks
      when: macinit_homebrew_upgrade_all | default(true)
      block:
        - name: Upgrade casks
          community.general.homebrew_cask:
            upgrade_all: true
      rescue:
        - name: Warn on failed cask upgrades
          ansible.builtin.debug:
            msg: >-
              Cask upgrade failed: {{ ansible_failed_result.msg | default('unknown error') }}.
              Casks requiring sudo (e.g. docker-desktop) may need manual: brew upgrade --cask
  always:
    - name: Stop sudo keepalive for Homebrew cask installers
      ansible.builtin.command: "/bin/kill {{ macinit_homebrew_cask_sudo_keepalive_pid.stdout }}"
      changed_when: false
      failed_when: false
      when:
        - macinit_homebrew_cask_sudo_keepalive_pid is defined
        - macinit_homebrew_cask_sudo_keepalive_pid.stdout is defined
        - macinit_homebrew_cask_sudo_keepalive_pid.stdout | length > 0

    - name: Remove temporary passwordless sudo for Homebrew cask installers
      ansible.builtin.file:
        path: "{{ macinit_homebrew_cask_temporary_sudoers_path }}"
        state: absent
      become: true
      when: macinit_homebrew_cask_temporary_passwordless_sudo | default(false) | bool

- name: Get installed Homebrew taps
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/brew tap"
  register: macinit_brew_taps_installed
  changed_when: false
  check_mode: false
  when: macinit_homebrew_prune_enabled | bool
  tags: [packages, brew]

- name: Remove taps not in desired list
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: absent
  register: macinit_brew_tap_remove_result
  failed_when: >-
    macinit_brew_tap_remove_result is failed and
    'is not allowed' not in (macinit_brew_tap_remove_result.msg | default(''))
  loop: "{{ macinit_brew_taps_installed.stdout_lines | default([]) }}"
  when:
    - macinit_homebrew_prune_enabled | bool
    - item | lower not in (macinit_homebrew_tap | map('lower') | list)
    - item | lower not in (macinit_homebrew_protected_taps | map('lower') | list)
  tags: [packages, brew]

- name: Install or upgrade Python tools via uv
  ansible.builtin.command: "{{ macinit_brew_bin_path }}/uv tool install --upgrade {{ item }}"
  loop: "{{ macinit_uv_tools }}"
  register: macinit_uv_tool_result
  changed_when: >-
    'Installed' in macinit_uv_tool_result.stdout or
    'Updated' in macinit_uv_tool_result.stdout
  when: macinit_uv_tools | length > 0
  tags: [packages, uv]
